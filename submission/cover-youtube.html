<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TOF Project Assistant — YouTube Cover</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
    }

    body {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        background: #1b1a3a;
        color: #ffffff;
    }

    .cover {
        position: relative;
        width: 1280px;
        height: 720px;
        background:
            radial-gradient(circle at 82% 12%, rgba(118, 75, 162, 0.55) 0%, rgba(118, 75, 162, 0) 52%),
            radial-gradient(circle at 8% 88%, rgba(102, 126, 234, 0.45) 0%, rgba(102, 126, 234, 0) 55%),
            linear-gradient(135deg, #232152 0%, #2d2a63 45%, #3a2a6b 100%);
        padding: 58px 72px 54px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
    }

    /* faint grid, gives the flat gradient some texture */
    .cover::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
            linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
        background-size: 64px 64px;
        pointer-events: none;
    }

    .cover > * { position: relative; }

    /* ---------- top row ---------- */
    .top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 32px;
    }

    .event {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        border: 1px solid rgba(255,255,255,0.28);
        background: rgba(255,255,255,0.07);
        border-radius: 100px;
        padding: 9px 20px 9px 14px;
        font-size: 14px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.88);
        font-weight: 600;
        white-space: nowrap;
    }

    .event .dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: #4ade80;
        box-shadow: 0 0 0 4px rgba(74,222,128,0.18);
        flex: 0 0 auto;
    }

    .brand {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 13px;
    }

    .brand-mark {
        display: block;
        height: 62px;
        width: auto;
        flex: 0 0 auto;
    }

    .credit {
        text-align: right;
        font-size: 14px;
        line-height: 1.7;
        color: rgba(255,255,255,0.55);
        white-space: nowrap;
    }

    .credit b {
        display: block;
        font-size: 16px;
        color: rgba(255,255,255,0.9);
        letter-spacing: 0.01em;
    }

    /* ---------- middle ---------- */
    .mid {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-bottom: 18px;
    }

    h1 {
        font-size: 86px;
        line-height: 0.98;
        letter-spacing: -0.028em;
        font-weight: 800;
    }

    h1 .accent {
        background: linear-gradient(100deg, #a5b4fc 0%, #7dd3fc 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .tagline {
        margin-top: 22px;
        font-size: 26px;
        line-height: 1.38;
        color: rgba(255,255,255,0.9);
        max-width: 830px;
        font-weight: 400;
    }

    .tagline b {
        font-weight: 700;
        color: #ffffff;
        box-shadow: inset 0 -10px 0 rgba(125,211,252,0.22);
    }

    /* ---------- bottom ---------- */
    .bottom {
        display: flex;
        align-items: flex-end;
        justify-content: flex-start;
        gap: 40px;
    }

    .rules {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
        max-width: 900px;
    }

    .rule {
        font-size: 14.5px;
        font-weight: 600;
        padding: 9px 16px;
        border-radius: 8px;
        background: rgba(255,255,255,0.09);
        border: 1px solid rgba(255,255,255,0.16);
        color: rgba(255,255,255,0.92);
        white-space: nowrap;
    }

    .rule.gate {
        background: rgba(74,222,128,0.14);
        border-color: rgba(74,222,128,0.42);
        color: #bbf7d0;
    }
</style>
</head>
<body>
<div class="cover">

    <div class="top">
        <div class="event"><span class="dot"></span>Accountable AI for project delivery</div>
        <div class="brand">
            <img class="brand-mark" src="logo-tof-digital-white.png" alt="TOF Solusi Digital">
            <div class="credit">
                <b>TOF Solusi Digital</b>
                Built on WorkBuddy AI
            </div>
        </div>
    </div>

    <div class="mid">
        <h1>TOF Project<br><span class="accent">Assistant</span></h1>
        <p class="tagline">
            Turns messy client briefs into validated project plans &mdash; and <b>stops for approval</b> before anything leaves the room.
        </p>
    </div>

    <div class="bottom">
        <div class="rules">
            <div class="rule">Shows sources</div>
            <div class="rule">Within permissions</div>
            <div class="rule gate">Asks before acting</div>
            <div class="rule">Admits limits</div>
            <div class="rule">Keeps a record</div>
        </div>
    </div>

</div>
</body>
</html>
